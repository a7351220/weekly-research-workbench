<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Research Workbench</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-title">weekly-research-workbench</div>
          <div class="brand-subtitle">tui / rss / source-context / local-only</div>
        </div>
        <div class="statusline">
          <span id="status">idle</span>
          <span id="pinned-count">pinned: 0</span>
          <span id="selection-count">selected: 0</span>
          <button id="settings-open" type="button" class="secondary small">settings</button>
        </div>
      </header>

      <section class="controls-overlay" id="controls-overlay" hidden>
        <div class="controls-backdrop" id="controls-backdrop"></div>
        <div class="controls-shell">
          <div class="controls-toolbar">
            <div class="controls-title">settings</div>
            <button id="settings-close" type="button" class="secondary small">close</button>
          </div>
      <section class="controls">
        <div class="controls-quick">
          <div class="control-group control-group-wide">
            <label for="api-base">api_base</label>
            <div class="masked-input-row">
              <input
                id="api-base"
                type="password"
                autocomplete="off"
                spellcheck="false"
                value="https://weekly-rss-middleware.c7351220.workers.dev"
              />
              <button id="toggle-api-base" type="button" class="secondary toggle-secret">
                show
              </button>
            </div>
          </div>
          <div class="control-group">
            <label for="days">days</label>
            <input id="days" type="number" min="1" max="30" value="7" />
          </div>
          <div class="control-group control-group-categories">
            <div class="source-header-row">
              <label>categories</label>
              <div class="source-actions">
                <button id="categories-select-all" type="button" class="secondary small">all</button>
                <button id="categories-select-default" type="button" class="secondary small">default</button>
              </div>
            </div>
            <div id="categories-picker" class="categories-picker"></div>
          </div>
          <div class="actions actions-quick">
            <button id="load-weekly">load_weekly</button>
            <button id="clear-selection" class="secondary">clear_selection</button>
            <button id="export-json" class="secondary">export_json</button>
            <button id="export-markdown" class="secondary">export_markdown</button>
          </div>
        </div>

        <details class="controls-advanced">
          <summary class="source-header-row">
            <span>advanced settings</span>
            <span class="summary-hint">sources / signals / keyword / limits</span>
          </summary>
          <div class="controls-advanced-grid">
            <div class="control-group">
              <label for="limit-per-source">limit_per_source</label>
              <input id="limit-per-source" type="number" min="1" max="20" value="6" />
            </div>
            <div class="control-group">
              <label for="max-items">max_items_per_category</label>
              <input id="max-items" type="number" min="1" max="50" value="10" />
            </div>
            <div class="control-group control-group-keyword">
              <label for="keyword">keyword</label>
              <input id="keyword" type="text" placeholder="optional" value="" />
            </div>
            <details class="control-group control-group-sources control-group-collapsible">
              <summary class="source-header-row">
                <span>sources</span>
                <span class="summary-hint">advanced</span>
              </summary>
              <div class="source-actions">
                <button id="sources-select-all" type="button" class="secondary small">all</button>
                <button id="sources-clear-all" type="button" class="secondary small">none</button>
                <button id="sources-select-default" type="button" class="secondary small">default</button>
              </div>
              <div id="sources-picker" class="sources-picker">loading sources...</div>
            </details>
            <details class="control-group control-group-signals control-group-collapsible">
              <summary class="source-header-row">
                <span>signals</span>
                <span class="summary-hint">advanced</span>
              </summary>
              <div class="signals-picker">
                <label class="source-pill">
                  <input id="use-private-signals" type="checkbox" />
                  <span>private signals</span>
                </label>
                <label class="source-pill">
                  <input id="use-blockbeats" type="checkbox" />
                  <span>BlockBeats</span>
                </label>
                <label class="source-pill">
                  <input id="use-opennews" type="checkbox" />
                  <span>OpenNews</span>
                </label>
                <label class="source-pill">
                  <input id="use-twitter-kols" type="checkbox" />
                  <span>Twitter / X KOLs</span>
                </label>
              </div>
            </details>
          </div>
        </details>
      </section>
        </div>
      </section>

      <section class="workspace">
        <aside class="panel panel-topics">
          <div class="panel-header">
            <span>topics</span>
            <span id="topics-meta">0</span>
          </div>
          <div class="panel-body">
            <div class="tabbar">
              <button id="tab-bundles" class="tab is-active" type="button">bundles</button>
              <button id="tab-clusters" class="tab" type="button">clusters</button>
              <button id="tab-raw" class="tab" type="button">raw</button>
            </div>
            <div class="subcontrols">
              <div class="control-inline">
                <label for="topic-sort">sort</label>
                <select id="topic-sort">
                  <option value="story">story</option>
                  <option value="sq">source_quality</option>
                  <option value="co">corroboration</option>
                  <option value="mr">market_reaction</option>
                  <option value="ed">editorial</option>
                </select>
              </div>
              <label class="checkbox-inline">
                <input id="hide-weak-topics" type="checkbox" />
                <span>hide weak</span>
              </label>
              <button id="merge-topics" type="button" class="secondary small">merge selected</button>
              <button id="clear-merge-selection" type="button" class="secondary small">clear merge</button>
            </div>
            <div id="topics-list" class="scroll topics-scroll"></div>
          </div>
        </aside>

        <div
          id="resize-topics"
          class="panel-resizer"
          role="separator"
          aria-label="resize topics panel"
          aria-orientation="vertical"
          tabindex="0"
        ></div>

        <main class="panel panel-articles">
          <div class="panel-header">
            <span>articles</span>
            <span id="articles-meta">0</span>
          </div>
          <div class="panel-body">
            <div class="subcontrols">
              <div class="control-inline">
                <label for="article-sort">sort</label>
                <select id="article-sort">
                  <option value="editorial">editorial</option>
                  <option value="sq">source_quality</option>
                  <option value="co">corroboration</option>
                  <option value="mr">market_reaction</option>
                  <option value="latest">latest</option>
                </select>
              </div>
              <label class="checkbox-inline">
                <input id="selected-only" type="checkbox" />
                <span>selected only</span>
              </label>
              <label class="checkbox-inline">
                <input id="official-only" type="checkbox" />
                <span>official-backed</span>
              </label>
              <label class="checkbox-inline">
                <input id="evidence-strong-only" type="checkbox" />
                <span>evidence-strong</span>
              </label>
            </div>
            <div id="articles-list" class="scroll articles-scroll"></div>
          </div>
        </main>

        <div
          id="resize-context"
          class="panel-resizer"
          role="separator"
          aria-label="resize context panel"
          aria-orientation="vertical"
          tabindex="0"
        ></div>

        <aside class="panel panel-context">
          <div class="panel-header">
            <span>context</span>
            <span id="context-meta">none</span>
          </div>
          <div class="panel-body scroll">
            <div id="context-view" class="context-empty">
              select an article to load source_context
            </div>
          </div>
        </aside>
      </section>
    </div>

    <template id="topic-item-template">
      <div class="topic-card">
        <button class="topic-item">
          <div class="topic-item-title"></div>
          <div class="topic-item-summary"></div>
          <div class="topic-item-tags"></div>
          <div class="topic-item-meta"></div>
        </button>
        <div class="topic-actions">
          <label class="checkbox-inline">
            <input class="topic-merge" type="checkbox" />
            <span>merge</span>
          </label>
          <label class="checkbox-inline">
            <input class="topic-pinned" type="checkbox" />
            <span>pin</span>
          </label>
          <button class="topic-split secondary small" type="button" hidden>split</button>
          <input class="topic-note" type="text" placeholder="topic note" />
        </div>
      </div>
    </template>

    <template id="article-item-template">
      <div class="article-item">
        <div class="article-main">
          <button class="article-open"></button>
          <div class="article-meta"></div>
          <div class="article-links"></div>
        </div>
        <div class="article-actions">
          <label class="checkbox-inline">
            <input class="article-selected" type="checkbox" />
            <span>select</span>
          </label>
          <select class="article-role">
            <option value="core">core</option>
            <option value="related">related</option>
          </select>
          <input class="article-note" type="text" placeholder="article note" />
        </div>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
